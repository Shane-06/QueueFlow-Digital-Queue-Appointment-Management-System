<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('My queue')}"></head><body><header th:replace="~{fragments :: header}"></header><aside th:replace="~{fragments :: nav}"></aside><main class="workspace"><h1>My queue</h1><p>Refresh this page to see the latest status.</p><a th:href="@{/student/queue}">Refresh status</a><p th:if="${entries.isEmpty()}">You have no queue tokens today. <a th:href="@{/student/services}">Browse services</a></p><section class="panel" th:each="q:${entries}"><h2 th:text="${q.token}"></h2><p th:text="${services.?[id==#vars.q.serviceId][0].name}"></p><span class="badge" th:text="${q.status}"></span><p th:if="${q.status=='WAITING'}" th:text="${ahead[q.id]}+' people ahead · estimated '+${ahead[q.id]*services.?[id==#vars.q.serviceId][0].duration}+' minutes'"></p><p th:if="${q.status=='CALLED' or q.status=='SERVING'}" th:text="'Proceed to '+${counters.?[id==#vars.q.counterId][0].name}"></p></section></main></body></html>
