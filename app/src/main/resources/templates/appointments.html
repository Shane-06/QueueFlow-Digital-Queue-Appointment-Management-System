<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Appointments')}"></head><body><header th:replace="~{fragments :: header}"></header><aside th:replace="~{fragments :: nav}"></aside><main class="workspace"><h1>My appointments</h1><a th:href="@{/student/services}">Book another appointment</a><p th:if="${appointments.isEmpty()}">No appointments yet.</p><section class="panel" th:each="a:${appointments}"><h2 th:text="${services.?[id==#vars.a.serviceId][0].name}"></h2><p th:text="${a.day}+' · '+${slots.?[id==#vars.a.slotId][0].starts}"></p><p th:text="${a.reference}"></p><span class="badge" th:text="${a.status}"></span><div class="row" th:if="${a.status=='BOOKED'}"><form th:action="@{/student/appointments/{id}/cancel(id=${a.id})}" method="post" data-confirm="Cancel this appointment?"><button class="secondary">Cancel</button></form><a th:href="@{/student/appointments/new(serviceId=${a.serviceId},rescheduleId=${a.id})}">Reschedule</a><form th:if="${a.day==today}" th:action="@{/student/appointments/{id}/check-in(id=${a.id})}" method="post"><button>Check in</button></form></div></section></main></body></html>
