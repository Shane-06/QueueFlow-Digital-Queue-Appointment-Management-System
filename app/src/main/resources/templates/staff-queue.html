<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Service counter')}"></head><body><header th:replace="~{fragments :: header}"></header><aside th:replace="~{fragments :: nav}"></aside><main class="workspace"><h1>Service counter</h1><p th:if="${counters.isEmpty()}">No active counter assigned. Contact administration.</p><form method="get" th:action="@{/staff/queue}" class="grid-form"><label>Assigned counter<select name="counterId"><option th:each="c:${counters}" th:value="${c.id}" th:selected="${c.id==counterId}" th:text="${c.name}"></option></select></label><button>Open counter</button></form><form th:if="${counterId!=null}" th:action="@{/staff/queue/next}" method="post"><input type="hidden" name="counterId" th:value="${counterId}"><button>Call next</button></form><section class="panel"><h2>Today's queue and history</h2><p th:if="${entries.isEmpty()}">No tokens for the assigned services today.</p><div class="row" th:each="q:${entries}"><strong th:text="${q.token}"></strong><span class="badge" th:text="${q.status}"></span><div th:if="${q.counterId==counterId}"><form class="inline" th:if="${q.status=='CALLED'}" th:action="@{/staff/queue/{id}/start(id=${q.id})}" method="post"><button>Start</button></form><form class="inline" th:if="${q.status=='SERVING'}" th:action="@{/staff/queue/{id}/complete(id=${q.id})}" method="post"><button>Complete</button></form><form class="inline" th:if="${q.status=='CALLED' or q.status=='SERVING'}" th:action="@{/staff/queue/{id}/hold(id=${q.id})}" method="post"><button class="secondary">Hold</button></form><form class="inline" th:if="${q.status=='HOLD'}" th:action="@{/staff/queue/{id}/requeue(id=${q.id})}" method="post"><button>Requeue</button></form><form th:if="${q.status=='CALLED' or q.status=='SERVING' or q.status=='HOLD'}" th:action="@{/staff/queue/{id}/skip(id=${q.id})}" method="post" data-confirm="Skip this token?"><label>Skip reason<input name="reason" maxlength="500" required></label><button class="secondary">Skip</button></form></div></div></section><section class="panel"><h2>Today's appointments</h2><p th:each="a:${appointments}" th:text="${a.reference}+' · '+${a.status}"></p></section></main></body></html>
