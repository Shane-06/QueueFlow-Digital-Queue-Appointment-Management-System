<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Services')}"></head><body><header th:replace="~{fragments :: header}"></header><aside th:replace="~{fragments :: nav}"></aside><main class="workspace"><div class="page-heading"><div><span class="eyebrow">Student / college services</span><h1>What can we help with?</h1><p>Reserve an arrival window or join a walk-in queue during office hours.</p></div><a class="button secondary" th:href="@{/student/appointments}">My appointments</a></div><label class="filter">Find a service<input type="search" placeholder="Search by name or description" data-filter=".service-card"></label><div class="service-grid"><section class="panel service-card" th:each="s:${services}" th:if="${s.active}"><div class="panel-header"><span class="service-icon" th:text="${s.code}"></span><span class="badge" data-status="ACTIVE">AVAILABLE</span></div><h2 th:text="${s.name}"></h2><p th:text="${s.description}"></p><p><strong th:text="${s.duration}+' min'"></strong> average service time</p><div class="actions"><a class="button" th:if="${s.appointmentEnabled}" th:href="@{/student/appointments/new(serviceId=${s.id})}">Book appointment</a><form th:if="${s.walkInEnabled}" th:action="@{/student/queue/join}" method="post"><input type="hidden" name="serviceId" th:value="${s.id}"><button class="secondary">Join walk-in queue</button></form></div></section></div></main></body></html>
