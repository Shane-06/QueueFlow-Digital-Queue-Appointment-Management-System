<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Services')}"></head><body><header th:replace="~{fragments :: header}"></header><aside th:replace="~{fragments :: nav}"></aside><main class="workspace"><h1>College services</h1><p>Choose a service to book an appointment or join the walk-in queue.</p><section class="panel" th:each="s:${services}" th:if="${s.active}"><h2 th:text="${s.name}"></h2><p th:text="${s.description}"></p><p th:text="${s.duration}+' minutes per service'"></p><a class="button" th:if="${s.appointmentEnabled}" th:href="@{/student/appointments/new(serviceId=${s.id})}">Book appointment</a><form th:if="${s.walkInEnabled}" th:action="@{/student/queue/join}" method="post"><input type="hidden" name="serviceId" th:value="${s.id}"><button>Join walk-in queue</button></form></section></main></body></html>
