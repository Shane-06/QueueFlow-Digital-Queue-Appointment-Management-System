<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><form th:fragment="serviceForm(s)" th:action="@{/admin/services}" method="post" class="grid-form"><input type="hidden" name="id" th:value="${s.id}"><label>Service name<input type="text" name="name" th:value="${s.name}" required maxlength='120'></label><label>Code<input type="text" name="code" th:value="${s.code}" required pattern='[A-Z0-9]{2,12}'></label><label>Description<input type="text" name="description" th:value="${s.description}" required maxlength='1000'></label><label>Duration (minutes)<input type="number" name="duration" th:value="${s.duration}" min='5' max='180' required></label><label>Places per slot<input type="number" name="slotCapacity" th:value="${s.slotCapacity}" min='1' required></label><label>Appointments per day<input type="number" name="appointmentCapacity" th:value="${s.appointmentCapacity}" min='1' required></label><label>Walk-ins per day<input type="number" name="walkInCapacity" th:value="${s.walkInCapacity}" min='1' required></label><label class="check"><input type="checkbox" name="active" value="true" th:checked="${s.active}">Active</label><label class="check"><input type="checkbox" name="appointments" value="true" th:checked="${s.appointmentEnabled}">Appointments</label><label class="check"><input type="checkbox" name="walkIns" value="true" th:checked="${s.walkInEnabled}">Walk-ins</label><button>Save service</button></form><form th:fragment="userForm(u)" th:action="@{/admin/staff}" method="post" class="grid-form"><input type="hidden" name="id" th:value="${u.id}"><label>Name<input type="text" name="name" th:value="${u.name}" required maxlength='120'></label><label>Email<input type="email" name="email" th:value="${u.email}" required></label><label>Role<select name="role"><option th:each="r:${roles}" th:value="${r}" th:text="${r}" th:selected="${r==u.role}"></option></select></label><label>New password (leave blank to keep)<input type="password" name="password" minlength="12" maxlength="72" autocomplete="new-password" th:required="${u.id==null}"></label><label class="check"><input type="checkbox" name="active" value="true" th:checked="${u.active}">Active</label><button>Save account</button></form><form th:fragment="counterForm(c)" th:action="@{/admin/counters}" method="post" class="grid-form"><input type="hidden" name="id" th:value="${c.id}"><label>Name<input type="text" name="name" th:value="${c.name}" required></label><label>Location<input type="text" name="location" th:value="${c.location}" required></label><fieldset><legend>Services</legend><label class="check" th:each="s:${services}"><input type="checkbox" name="serviceIds" th:value="${s.id}" th:checked="${counterServices.?[#this[0]==#vars.c.id and #this[1]==#vars.s.id].size()>0}"><span th:text="${s.name}"></span></label></fieldset><fieldset><legend>Staff</legend><label class="check" th:each="u:${users}" th:if="${u.role=='STAFF'}"><input type="checkbox" name="staffIds" th:value="${u.id}" th:checked="${counterStaff.?[#this[0]==#vars.c.id and #this[1]==#vars.u.id].size()>0}"><span th:text="${u.name}"></span></label></fieldset><label class="check"><input type="checkbox" name="active" value="true" th:checked="${c.active}">Active</label><button>Save counter</button></form></body></html>
