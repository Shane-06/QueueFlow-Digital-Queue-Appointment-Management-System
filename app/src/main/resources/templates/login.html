<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · QueueFlow</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="welcome"><span class="eyebrow">QUEUEFLOW · COLLEGE SERVICES</span><h1>Welcome back</h1><p>Sign in with your college service account.</p><p th:if="${param.error}" role="alert">Email or password is incorrect, or your account is inactive.</p><p th:if="${param.logout}">You have signed out.</p><p th:if="${param.disabled}" role="alert">Your account access changed. Please sign in again.</p><form th:action="@{/login}" method="post"><label for="email">Email</label><input id="email" name="username" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><p><button type="submit">Sign in</button></p></form><small>Need an account? Contact the college administrator.</small></main></body></html>
