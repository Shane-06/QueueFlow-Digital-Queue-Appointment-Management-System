<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Book appointment')}"></head><body><header th:replace="~{fragments :: header}"></header><aside th:replace="~{fragments :: nav}"></aside><main class="workspace"><h1 th:text="${service.name}"></h1><p>Select a date, then confirm an available slot. Queue tokens are issued at check-in.</p><form method="get" th:action="@{/student/appointments/new}" class="panel"><input type="hidden" name="serviceId" th:value="${service.id}"><input type="hidden" name="rescheduleId" th:value="${rescheduleId}"><label>Date<input type="date" name="date" th:value="${date}" th:min="${today}" th:max="${today.plusDays(60)}" required></label><button>Show slots</button></form><p th:if="${slots.isEmpty()}">No slots available on this date.</p><section class="panel"><form th:each="s:${slots}" th:action="${rescheduleId==null}?@{/student/appointments}:@{/student/appointments/{id}/reschedule(id=${rescheduleId})}" method="post" class="row" data-confirm="Confirm this appointment slot?"><span th:text="${s.starts}+'–'+${s.ends}+' · '+${remaining[s.id]}+' places remaining'"></span><input type="hidden" name="slotId" th:value="${s.id}"><button th:disabled="${remaining[s.id]<=0}" th:text="${remaining[s.id]>0?'Confirm slot':'Full'}"></button></form></section></main></body></html>
