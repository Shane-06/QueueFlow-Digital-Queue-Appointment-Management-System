spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/queueflow}
    username: ${DB_USERNAME:queueflow}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  application:
    name: queueflow
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
queueflow:
  seed-password: ${DEMO_PASSWORD:}
